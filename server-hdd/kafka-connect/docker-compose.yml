# Kafka Connect component: connects to externally configured SQL Server, Kafka, and ScyllaDB endpoints.
name: arify-kafka-connect

services:
  kafka-connect:
    build:
      context: .
      args:
        CP_KAFKA_CONNECT_VERSION: 7.7.1
        DEBEZIUM_VERSION: 2.7.3
        DATASTAX_SINK_VERSION: 1.7.6
        DATASTAX_SINK_SHA256: 83db4a8b7edbd73c4cd17c151718c88a5dc33e34d90f1ed80e7f632d75dc8d25
    container_name: arify-kafka-connect
    hostname: arify-kafka-connect
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      # Kafka, SQL Server y ScyllaDB se alcanzan por endpoints externos definidos en .env.
      CONNECT_BOOTSTRAP_SERVERS: "${KAFKA_BOOTSTRAP_SERVERS}"
      CONNECT_REST_ADVERTISED_HOST_NAME: arify-kafka-connect
      CONNECT_REST_PORT: "8083"
      CONNECT_GROUP_ID: arify-cdc-connect
      CONNECT_CONFIG_STORAGE_TOPIC: "${CONNECT_CONFIG_TOPIC}"
      CONNECT_OFFSET_STORAGE_TOPIC: "${CONNECT_OFFSET_TOPIC}"
      CONNECT_STATUS_STORAGE_TOPIC: "${CONNECT_STATUS_TOPIC}"
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components,/usr/share/kafka/plugins,/opt/kafka-connect/custom-plugins
      # Permite que los JSON de conectores resuelvan valores ${env:NOMBRE_VARIABLE}.
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
    ports:
      # La API REST queda disponible solo para administracion local.
      - "127.0.0.1:8083:8083"
    volumes:
      - ./connectors:/connectors:ro
      - ./plugins:/opt/kafka-connect/custom-plugins:ro
    cpus: 1.0
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/connectors >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
