# Single-node KRaft POC: the broker also runs the controller role.
process.roles=broker,controller
node.id=1
controller.quorum.voters=1@kafka:9093
listeners=PLAINTEXT://:9092,CONTROLLER://:9093
# Debe ser una IP o DNS alcanzable desde Kafka Connect; no usar localhost.
advertised.listeners=PLAINTEXT://__KAFKA_ADVERTISED_HOST__:__KAFKA_ADVERTISED_PORT__
listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
inter.broker.listener.name=PLAINTEXT
controller.listener.names=CONTROLLER
log.dirs=/var/lib/kafka/data
num.partitions=1
# Los topicos se crean manualmente con su retencion o compactacion explicita.
auto.create.topics.enable=false
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
group.initial.rebalance.delay.ms=0
log.retention.check.interval.ms=60000
