# Kafka component: standalone KRaft broker; topics are created manually after startup.
name: arify-kafka

services:
  kafka:
    image: apache/kafka:3.7.1
    container_name: arify-kafka
    hostname: arify-kafka
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
    entrypoint: ["/bin/bash", "/etc/kafka/start-kraft.sh"]
    ports:
      - "9092:9092"
    volumes:
      - ./config/server.properties:/etc/kafka/server.properties:ro
      - ./start-kraft.sh:/etc/kafka/start-kraft.sh:ro
      - /var/app/kafka:/var/lib/kafka/data
    cpus: 1.0
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
