# Dedicated Kafka Connect worker for SQL Server CDC -> Kafka through Debezium.
name: arify-kafka-connect-debezium

services:
  kafka-connect-debezium:
    build:
      context: .
      args:
        CP_KAFKA_CONNECT_VERSION: 7.7.1
        DEBEZIUM_VERSION: 2.7.3.Final
    container_name: arify-kafka-connect-debezium
    hostname: arify-kafka-connect-debezium
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      # Kafka and SQL Server are external endpoints defined in this component's .env.
      CONNECT_BOOTSTRAP_SERVERS: "${KAFKA_BOOTSTRAP_SERVERS}"
      CONNECT_REST_ADVERTISED_HOST_NAME: arify-kafka-connect-debezium
      CONNECT_REST_PORT: "8083"
      CONNECT_GROUP_ID: "${CONNECT_GROUP_ID}"
      CONNECT_CONFIG_STORAGE_TOPIC: "${CONNECT_CONFIG_TOPIC}"
      CONNECT_OFFSET_STORAGE_TOPIC: "${CONNECT_OFFSET_TOPIC}"
      CONNECT_STATUS_STORAGE_TOPIC: "${CONNECT_STATUS_TOPIC}"
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components,/usr/share/kafka/plugins,/opt/kafka-connect/custom-plugins
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
    ports:
      # REST API is limited to local administration on the server-hdd host.
      - "127.0.0.1:8083:8083"
    volumes:
      - ./connectors:/connectors:ro
      - ./plugins:/opt/kafka-connect/custom-plugins:ro
    cpus: 1.0
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/connectors >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
