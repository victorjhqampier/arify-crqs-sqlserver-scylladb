# SQL Server component: single-container deployment; restore and CDC setup are manual.
name: arify-sql-server

services:
  sql-server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: arix-mssql
    hostname: arix-mssql
    restart: always
    env_file:
      - ./.env
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - /var/app/mssql:/var/opt/mssql
      - /var/apps/database/mssql/backups:/var/opt/mssql/backups
      - ./init:/scripts:ro
    mem_limit: 3g
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$SA_PASSWORD\" -Q 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
